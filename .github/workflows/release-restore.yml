name: Release Restore

# Rebuilds a missing release from its immutable tag. A matrix keeps exactly
# one tag per release; the previous multi-line tag_name could not represent
# multiple missing releases and mixed their artifacts.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional: only check this specific tag (e.g. v0.2.2).'
        required: false
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.missing.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find tags without releases
        id: missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --prune --prune-tags origin
          : > /tmp/missing.txt
          while read -r TAG; do
            [ -z "$TAG" ] && continue
            if [ -n "$ONLY_TAG" ] && [ "$TAG" != "$ONLY_TAG" ]; then continue; fi
            if ! gh api --silent "/repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "$TAG" >> /tmp/missing.txt
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)
          jq -R -s 'split("\n") | map(select(length > 0))' /tmp/missing.txt > /tmp/missing.json
          cat /tmp/missing.json
          echo "tags=$(cat /tmp/missing.json)" >> "$GITHUB_OUTPUT"

  restore:
    needs: discover
    if: needs.discover.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.discover.outputs.tags) }}
    name: Restore ${{ matrix.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build web client when present in this tag
        run: |
          if [ -f web/package.json ]; then
            npm --prefix web ci
            npm --prefix web run build
          fi
      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          GOEXPERIMENT: greenteagc
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG='${{ matrix.tag }}'
          COMMIT="$(git rev-parse HEAD)"
          LDFLAGS="-s -w -X github.com/Omerfaruk-aydn/Atlas-Agent/internal/version.Version=${TAG} -X github.com/Omerfaruk-aydn/Atlas-Agent/internal/version.Commit=${COMMIT}"
          if [ -d internal/remotecontrol/relaybin ]; then go generate ./internal/remotecontrol/relaybin; fi
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/atlas-agent-windows-x64.exe .
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/atlas-agent-linux-x64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/atlas-agent-darwin-x64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/atlas-agent-darwin-arm64 .
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/atlas-agent.spdx.json
      - name: Create and verify checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum atlas-agent-* atlas-agent.spdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/atlas-agent-*
            dist/atlas-agent.spdx.json
      - name: Publish this missing release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ matrix.tag }}
          generate_release_notes: true
          files: |
            dist/atlas-agent-windows-x64.exe
            dist/atlas-agent-linux-x64
            dist/atlas-agent-darwin-x64
            dist/atlas-agent-darwin-arm64
            dist/atlas-agent.spdx.json
            dist/SHA256SUMS
            install.sh
            install.ps1
