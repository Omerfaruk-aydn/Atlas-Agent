<!doctype html>
<html><head><meta charset="utf-8"><title>Busy fixture</title></head>
<body>
<p id="status" role="status" aria-busy="true">Loading</p>
<script>
// Persistent traffic: network never goes idle, so readiness must come from
// a page condition instead.
setInterval(() => { fetch('/ping?' + Date.now()).catch(() => {}); }, 80);
setTimeout(() => {
  const s = document.getElementById('status');
  s.textContent = 'Ready';
  s.setAttribute('aria-busy', 'false');
}, 900);
</script>
</body></html>
