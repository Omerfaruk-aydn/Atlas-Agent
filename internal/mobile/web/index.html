<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Atlas Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
    <div class="brand"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><span>Atlas</span></div>
    <button class="icon-btn" id="settings-btn" type="button" data-i18n-label="settings"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
  </header>
  <div class="page-body">
    <button class="host-row" id="host-row" type="button">
      <svg class="row-icon" aria-hidden="true"><use href="#i-laptop"/></svg>
      <span class="host-name" id="host-name"></span>
      <span class="conn" id="list-conn"></span>
      <svg class="chev" aria-hidden="true"><use href="#i-chevron"/></svg>
    </button>
    <h1 tabindex="-1" class="display" id="list-h" data-i18n="chats"></h1>
    <div class="search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr-only" for="search" data-i18n="search"></label>
      <input id="search" type="search" class="input" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="search">
    </div>
    <div id="list-state" class="list-state hidden" role="status"></div>
    <div id="task-list" class="groups"></div>
    <p class="foot-note" id="list-foot" data-i18n="list_foot"></p>
  </div>
</section>

<!-- Conversation, permission and question -->
<section id="view-task" class="view chat hidden" aria-labelledby="task-h">
  <header class="chat-bar">
    <button class="icon-btn" id="back" type="button" data-i18n-label="back"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
    <div class="chat-title">
      <h1 tabindex="-1" id="task-h"></h1>
      <p class="conn-line"><span class="conn" id="task-conn"></span></p>
    </div>
    <button class="icon-btn hidden" id="screen-btn" type="button" aria-pressed="false" data-i18n-label="live_screen"><svg aria-hidden="true"><use href="#i-monitor"/></svg></button>
    <div class="menu-wrap">
      <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="task-menu" data-i18n-label="more"><svg aria-hidden="true"><use href="#i-more"/></svg></button>
      <div class="menu hidden" id="task-menu" role="menu">
        <button type="button" role="menuitem" id="m-pause"><svg aria-hidden="true"><use href="#i-pause"/></svg><span data-i18n="pause"></span></button>
        <button type="button" role="menuitem" id="m-resume"><svg aria-hidden="true"><use href="#i-play"/></svg><span data-i18n="resume"></span></button>
        <button type="button" role="menuitem" id="m-screen"><svg aria-hidden="true"><use href="#i-monitor"/></svg><span data-i18n="live_screen"></span></button>
        <button type="button" role="menuitem" id="m-preview"><svg aria-hidden="true"><use href="#i-monitor"/></svg><span data-i18n="preview"></span></button>
        <button type="button" role="menuitem" id="m-refresh"><svg aria-hidden="true"><use href="#i-refresh"/></svg><span data-i18n="refresh"></span></button>
      </div>
    </div>
  </header>

  <div class="offline-banner hidden" id="offline-banner" role="status">
    <svg aria-hidden="true"><use href="#i-unlink"/></svg>
    <div><strong id="offline-title"></strong><p id="offline-text"></p></div>
  </div>
  <button class="waiting-banner hidden" id="waiting-banner" type="button">
    <span class="dot warn" aria-hidden="true"></span><span id="waiting-text"></span><span class="link" id="waiting-open" data-i18n="view"></span>
  </button>

  <div class="view-switch segmented two hidden" id="view-switch" role="tablist" data-i18n-label="view_switch">
    <button type="button" role="tab" id="tab-chat" aria-selected="true" aria-controls="scroll"><span data-i18n="tab_chat"></span></button>
    <button type="button" role="tab" id="tab-screen" aria-selected="false" aria-controls="screen-pane"><span data-i18n="tab_screen"></span></button>
  </div>

  <section class="screen-pane hidden" id="screen-pane" aria-labelledby="screen-h">
    <h2 class="sr-only" id="screen-h" data-i18n="live_screen"></h2>
    <div class="screen-bar">
      <span class="dot" id="screen-dot" aria-hidden="true"></span>
      <span class="screen-state" id="screen-state" role="status" aria-live="polite"></span>
      <span class="screen-metrics" id="screen-metrics"></span>
    </div>
    <div class="screen-viewport" id="screen-viewport" tabindex="0" data-i18n-label="live_screen">
      <canvas id="screen-canvas" width="16" height="9"></canvas>
      <div class="screen-overlay hidden" id="screen-overlay"><svg aria-hidden="true"><use href="#i-unlink"/></svg><p id="screen-overlay-text"></p><button class="btn secondary hidden" id="screen-retry" type="button" data-i18n="retry"></button></div>
    </div>
    <p class="screen-note" id="screen-note"></p>
    <div class="screen-tools">
      <button class="icon-btn round" id="screen-zoom-out" type="button" data-i18n-label="zoom_out"><svg aria-hidden="true"><use href="#i-minus"/></svg></button>
      <span class="screen-zoom" id="screen-zoom" aria-live="polite">100%</span>
      <button class="icon-btn round" id="screen-zoom-in" type="button" data-i18n-label="zoom_in"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
      <button class="icon-btn round" id="screen-fit" type="button" data-i18n-label="zoom_fit"><svg aria-hidden="true"><use href="#i-fit"/></svg></button>
      <button class="icon-btn round" id="screen-full" type="button" data-i18n-label="fullscreen"><svg aria-hidden="true"><use href="#i-expand"/></svg></button>
      <button class="btn quiet screen-stop" id="screen-stop" type="button"><svg aria-hidden="true"><use href="#i-stop"/></svg><span data-i18n="stop_watching"></span></button>
    </div>
  </section>

  <div class="scroll" id="scroll">
    <div class="thread">
      <img id="preview-img" class="preview hidden" alt="">
      <ol class="messages" id="messages"></ol>
      <div id="activity"></div>
      <div id="run-errors"></div>
      <div id="status-card"></div>
    </div>
  </div>
  <button class="new-msgs hidden" id="new-msgs" type="button"><svg aria-hidden="true"><use href="#i-down"/></svg><span data-i18n="new_messages"></span></button>

  <div class="scroll pending-pane hidden" id="pending-pane" tabindex="-1"></div>

  <form class="composer" id="composer" novalidate>
    <div class="attach-chip hidden" id="attach-chip">
      <svg aria-hidden="true"><use href="#i-file"/></svg>
      <span class="attach-name" id="attach-name"></span>
      <span class="attach-state" id="attach-state" role="status"></span>
      <button class="icon-btn small" id="attach-remove" type="button" data-i18n-label="remove_attachment"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="composer-row">
      <label class="icon-btn round" id="attach-label">
        <input type="file" id="attach" accept="image/png,image/jpeg,image/gif,image/webp,text/plain,application/pdf" class="sr-only" data-i18n-label="attach">
        <svg aria-hidden="true"><use href="#i-clip"/></svg>
      </label>
      <div class="prompt-box">
        <label class="sr-only" for="prompt" data-i18n="message"></label>
        <textarea id="prompt" rows="1" maxlength="16000" enterkeyhint="enter"></textarea>
        <button class="send-btn" type="submit" id="send" data-i18n-label="send"><svg aria-hidden="true"><use href="#i-send"/></svg></button>
      </div>
    </div>
    <div class="composer-meta">
      <span class="model" id="model-name"></span>
      <span class="composer-note" id="composer-note" role="status"></span>
      <button class="stop-btn hidden" id="stop-btn" type="button"><span class="stop-ico"><svg aria-hidden="true"><use href="#i-stop"/></svg></span><span data-i18n="stop"></span></button>
    </div>
  </form>
</section>

<!-- Settings -->
<section id="view-settings" class="view page settings hidden" aria-labelledby="settings-h">
  <header class="chat-bar">
    <button class="icon-btn" id="settings-back" type="button" data-i18n-label="back"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
    <div class="chat-title"><h1 tabindex="-1" id="settings-h" data-i18n="settings"></h1></div>
    <svg class="mark end" aria-hidden="true"><use href="#i-mark"/></svg>
  </header>
  <div class="page-body">
    <h2 class="group-h" data-i18n="this_phone_group"></h2>
    <div class="group">
      <div class="row">
        <svg class="row-icon" aria-hidden="true"><use href="#i-phone"/></svg>
        <div class="row-main"><div id="set-device"></div><div class="muted small" id="set-paired"></div></div>
      </div>
      <div class="row">
        <svg class="row-icon" aria-hidden="true"><use href="#i-laptop"/></svg>
        <div class="row-main"><div id="set-computer"></div><div class="small"><span class="conn" id="set-conn"></span></div></div>
      </div>
    </div>

    <h2 class="group-h" id="theme-h" data-i18n="appearance"></h2>
    <div class="group">
      <div class="row">
        <svg class="row-icon" aria-hidden="true"><use href="#i-moon"/></svg>
        <div class="row-main"><span data-i18n="theme"></span></div>
      </div>
      <div class="segmented" role="radiogroup" aria-labelledby="theme-h">
        <label><input type="radio" name="theme" value="light"><span data-i18n="theme_light"></span></label>
        <label><input type="radio" name="theme" value="dark"><span data-i18n="theme_dark"></span></label>
        <label><input type="radio" name="theme" value="system"><span data-i18n="theme_system"></span></label>
      </div>
    </div>

    <h2 class="group-h" data-i18n="notifications_group"></h2>
    <div class="group">
      <label class="row" for="notify">
        <svg class="row-icon" aria-hidden="true"><use href="#i-bell"/></svg>
        <span class="row-main" data-i18n="notifications"></span>
        <input type="checkbox" role="switch" id="notify" class="switch">
      </label>
      <p class="row-note" id="notify-note"></p>
    </div>

    <h2 class="group-h" data-i18n="previews"></h2>
    <div class="group">
      <div class="row">
        <svg class="row-icon" aria-hidden="true"><use href="#i-monitor"/></svg>
        <div class="row-main" id="set-previews"></div>
      </div>
      <p class="row-note" id="set-previews-note"></p>
    </div>

    <h2 class="group-h" data-i18n="connection"></h2>
    <div class="group">
      <details class="row-details">
        <summary class="row"><svg class="row-icon" aria-hidden="true"><use href="#i-lock"/></svg><span class="row-main" data-i18n="certificate"></span><svg class="chev" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
        <div class="details-body"><p class="muted small" id="set-cert-note"></p><p class="mono small" id="set-fp"></p></div>
      </details>
    </div>

    <div id="install-section">
      <h2 class="group-h" data-i18n="install_group"></h2>
      <div class="group">
        <details class="row-details" id="install-details">
          <summary class="row"><svg class="row-icon" aria-hidden="true"><use href="#i-share"/></svg><span class="row-main" data-i18n="install_row"></span><svg class="chev" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
          <div class="details-body">
            <ol class="steps hidden" id="iphone-install"><li data-i18n="ios_step1"></li><li data-i18n="ios_step2"></li><li data-i18n="ios_step3"></li></ol>
            <ol class="steps hidden" id="android-install"><li data-i18n="android_step1"></li><li data-i18n="android_step2"></li><li data-i18n="android_step3"></li></ol>
            <p class="muted small" data-i18n="install_note"></p>
          </div>
        </details>
        <p class="row-note" id="install-summary"></p>
        <div class="row-note hidden" id="install-prompt-wrap"><button class="btn primary block" id="install-btn" type="button" data-i18n="install_now"></button></div>
        <div class="row-note hidden" id="transfer-wrap">
          <p data-i18n="transfer_offer"></p>
          <button class="btn secondary block" id="transfer-btn" type="button" data-i18n="transfer_create"></button>
          <p class="code transfer-code hidden" id="transfer-code-out" aria-live="polite"></p>
          <p class="muted small hidden" id="transfer-code-note"></p>
        </div>
      </div>
    </div>

    <div class="group danger-group">
      <button class="row danger" id="logout" type="button" aria-controls="logout-confirm" aria-expanded="false">
        <svg class="row-icon" aria-hidden="true"><use href="#i-trash"/></svg><span class="row-main" data-i18n="sign_out"></span>
      </button>
      <div class="confirm hidden" id="logout-confirm" role="group" aria-labelledby="logout-confirm-text">
        <p id="logout-confirm-text" data-i18n="sign_out_confirm"></p>
        <p class="form-error hidden" id="logout-error" role="alert"></p>
        <div class="confirm-actions">
          <button class="btn danger-fill" id="logout-yes" type="button" data-i18n="sign_out_yes"></button>
          <button class="btn secondary" id="logout-no" type="button" data-i18n="cancel"></button>
        </div>
      </div>
    </div>
    <p class="foot-note" id="set-version"></p>
  </div>
</section>
<script src="/app.js"></script>
</body>
</html>
