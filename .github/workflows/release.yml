name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.1). Defaults to the latest v* tag.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            # workflow_dispatch: caller picked the tag explicitly.
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = 'push' ]; then
            # tag push: the ref that triggered this run IS the release tag.
            TAG="${{ github.ref_name }}"
          else
            # workflow_dispatch with no input: fall back to the latest release.
            TAG=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              2>/dev/null \
              | jq -r .tag_name || true)
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::error::No release tag found via API; pass inputs.tag explicitly."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag $TAG"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build web client
        # Embedded into the binary by internal/webui; `atlas-agent web`
        # refuses to start without it.
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build all platforms
        env:
          CGO_ENABLED: '0'
          GOEXPERIMENT: greenteagc
        run: |
          mkdir -p dist
          TAG="${{ steps.tag.outputs.tag }}"
          COMMIT="$(git rev-parse HEAD)"
          LDFLAGS="-s -w -X github.com/Omerfaruk-aydn/Atlas-Agent/internal/version.Version=${TAG} -X github.com/Omerfaruk-aydn/Atlas-Agent/internal/version.Commit=${COMMIT}"
          # Bundle the Linux relay that /rc installs; its SHA-256 is checked again on the server.
          go generate ./internal/remotecontrol/relaybin
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/atlas-agent-windows-x64.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/atlas-agent-linux-x64 .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/atlas-agent-darwin-x64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/atlas-agent-darwin-arm64 .

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/atlas-agent.spdx.json

      - name: Create and verify checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum atlas-agent-* atlas-agent.spdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/atlas-agent-*
            dist/atlas-agent.spdx.json

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/atlas-agent-windows-x64.exe
            dist/atlas-agent-linux-x64
            dist/atlas-agent-darwin-x64
            dist/atlas-agent-darwin-arm64
            dist/atlas-agent.spdx.json
            dist/SHA256SUMS
            install.sh
            install.ps1
