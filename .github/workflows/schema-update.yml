name: Update files

# Regenerates schema.json when the config types change, so an editor
# validating a config against it is not describing an older release.
on:
  push:
    branches: [main]
    paths:
      - "internal/config/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schema-update
  cancel-in-progress: false

jobs:
  update-schema:
    runs-on: ubuntu-latest
    steps:
      # Checked out with the token the workflow is given. This used to ask for
      # a PERSONAL_ACCESS_TOKEN secret, which this repository does not have, so
      # every run failed on the first step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run . schema > ./schema.json
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v5
        with:
          commit_message: "chore: regenerate schema.json"
          file_pattern: schema.json
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
