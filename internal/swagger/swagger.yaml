info:
  contact:
    name: Atlas
    url: https://charm.sh
  description: ATLAS-AGENT is a terminal-based AI coding assistant. This API is served
    over a Unix socket (or Windows named pipe) and provides programmatic access to
    workspaces, sessions, agents, LSP, MCP, and more.
  license:
    name: MIT
    url: https://github.com/Omerfaruk-aydn/Atlas-Agent/blob/main/LICENSE
  title: ATLAS-AGENT API
  version: "1.0"
paths:
  /clients/{client_id}:
    delete:
      parameters:
      - description: Client ID (UUID)
        in: path
        name: client_id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Retire a client
      tags:
      - system
  /config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get server config
      tags:
      - system
  /control:
    post:
      consumes:
      - application/json
      parameters:
      - description: Control command (e.g. shutdown, shutdown_if_idle)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.ServerControl'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Send server control command
      tags:
      - system
  /health:
    get:
      responses:
        "200":
          description: OK
      summary: Health check
      tags:
      - system
  /version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.VersionInfo'
      summary: Get server version
      tags:
      - system
  /workspaces:
    get:
      produces:
      - application/json
      responses:
        "200":
