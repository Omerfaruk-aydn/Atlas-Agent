name: lint

# Self-contained. This used to call charmbracelet/meta's reusable lint
# workflow, which this repository has no claim on: GitHub could not resolve
# it, so every run ended in startup_failure before a single linter ran.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # v8 is the first release of the action that drives golangci-lint v2.
      # v6 targets v1 and passes flags v2 removed, so it fails before linting.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --config=.golangci.yml --timeout=10m
