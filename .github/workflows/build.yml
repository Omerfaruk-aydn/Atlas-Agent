name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Without this one failing platform cancels the other two, so a run
      # only ever reports the first failure it happens to hit.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go build -race ./...
      - name: Validate Windows speech installer routing
        run: node npm/cli/scripts/speech-setup.test.js
      - name: Enable sandboxed Chrome user namespaces on Ubuntu runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Validate Windows desktop and terminal fixtures
        if: runner.os == 'Windows'
        run: go test -race -count=1 ./internal/computer ./internal/ui/model -run 'TestWindowsAutomationReadAndFixtureOCR|TestWorkflowPanelRealPTYResizeStopAndClose'
      - run: go test -race ./...

  web:
    # The web client: typecheck, unit tests and the production build that
    # internal/webui embeds. The Go jobs above do not need it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
