<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" id="theme-color">
<meta name="description" content="Continue your Atlas chats from your phone.">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Atlas Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!-- One outline icon family: 24px grid, 1.75 stroke, round joins. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-mark" viewBox="0 0 64 64"><path class="fill" d="M32 12 50 52H42L38.4 43H25.6L22 52H14ZM28.2 36H35.8L32 26.4Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle class="fill" cx="5.5" cy="12" r="1.6"/><circle class="fill" cx="12" cy="12" r="1.6"/><circle class="fill" cx="18.5" cy="12" r="1.6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect class="fill" x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7 10l3 2.5L7 15M12.5 15H17"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></symbol>
  <symbol id="i-unlink" viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1.2-1.2a4.2 4.2 0 0 1 6 6L17 12.5"/><path d="M13 17.5l-1.2 1.2a4.2 4.2 0 0 1-6-6L7 11.5"/><path d="M4 4l2 2M20 20l-2-2"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8.5 20h7M12 16v4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7l4-3.5L16 7"/><path d="M7 11H6a1.5 1.5 0 0 0-1.5 1.5v7A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 18 11h-1"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></symbol>
  <symbol id="i-ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="9"/><path class="on-fill" d="M8 12.3l2.8 2.7L16 9.6"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M9.9 5.8A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.6 6.9A16.7 16.7 0 0 0 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/><path d="M8 10v4M16 10v4"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4a1.5 1.5 0 0 1 3 0v7M14 10.5V5.5a1.5 1.5 0 0 1 3 0v8.5a6.5 6.5 0 0 1-6.5 6.5H10a5 5 0 0 1-3.8-1.8L3.6 15.6a1.5 1.5 0 0 1 2.2-2L8 15.5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20.5V16h-4.5"/></symbol>
</svg>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<div class="update-bar hidden" id="update-bar" role="status"><span data-i18n="update_ready"></span><button class="link-btn" id="update-reload" type="button" data-i18n="update_reload"></button></div>
<p class="sr-only" id="announce" aria-live="polite"></p>

<!-- Pairing -->
<section id="view-pair" class="view page hidden" aria-labelledby="pair-h">
  <header class="topbar">
    <div class="brand"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><span>Atlas</span></div>
    <button class="icon-btn" id="pair-help-btn" type="button" aria-expanded="false" aria-controls="pair-help" data-i18n-label="help"><svg aria-hidden="true"><use href="#i-help"/></svg></button>
  </header>
  <div class="page-body">
    <p class="help-note hidden" id="pair-help" data-i18n="pair_help"></p>
    <svg class="pair-art" viewBox="0 0 300 120" aria-hidden="true" focusable="false">
      <rect class="art-line" x="34" y="18" width="116" height="74" rx="6"/>
      <path class="art-line" d="M18 100h148"/>
      <path class="art-line" d="M58 46l12 9-12 9M78 66h14"/>
      <path class="art-dash" d="M166 55h60"/>
      <circle class="art-dot" cx="196" cy="55" r="4.5"/>
      <rect class="art-line" x="232" y="14" width="52" height="96" rx="9"/>
      <use class="art-brand" href="#i-mark" x="240" y="44" width="36" height="36"/>
    </svg>
    <h1 tabindex="-1" class="display" id="pair-h" data-i18n="pair_title"></h1>

    <div id="pair-none" class="pair-stage hidden">
      <p class="lead" data-i18n="pair_need_qr"></p>
      <ol class="steps">
        <li data-i18n="pair_step_open"></li>
        <li data-i18n="pair_step_scan"></li>
        <li data-i18n="pair_step_compare"></li>
      </ol>
    </div>

    <form id="pair-transfer" class="pair-stage hidden" novalidate>
      <p class="lead" data-i18n="transfer_intro"></p>
      <ol class="steps">
        <li data-i18n="transfer_step1"></li>
        <li data-i18n="transfer_step2"></li>
      </ol>
      <label class="field" for="transfer-code"><span data-i18n="transfer_code"></span></label>
      <input id="transfer-code" class="input code-input" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="9" inputmode="text" enterkeyhint="go">
      <p class="form-error hidden" id="transfer-error" role="alert"></p>
      <button class="btn primary block" id="transfer-go" type="submit" data-i18n="transfer_button"></button>
      <p class="hint" data-i18n="transfer_qr_hint"></p>
    </form>

    <div id="pair-invalid" class="pair-stage hidden">
      <div class="notice warn" role="alert">
        <svg aria-hidden="true"><use href="#i-alert"/></svg>
        <div><strong data-i18n="pair_invalid_title"></strong><p id="pair-invalid-text" data-i18n="pair_invalid"></p></div>
      </div>
    </div>

    <form id="pair-start" class="pair-stage hidden" novalidate>
      <p class="lead" data-i18n="pair_intro"></p>
      <label class="field" for="pair-name"><span data-i18n="device_name"></span></label>
      <input id="pair-name" class="input" autocomplete="off" autocapitalize="words" maxlength="48" enterkeyhint="send">
      <p class="hint" data-i18n="pair_name_hint"></p>
      <p class="form-error hidden" id="pair-error" role="alert"></p>
      <button class="btn primary block" id="pair-go" type="submit" data-i18n="pair_button"></button>
    </form>

    <div id="pair-wait" class="pair-stage hidden">
      <p class="lead" data-i18n="pair_compare"></p>
      <div class="code-card">
        <div class="code-host">
          <svg class="row-icon" aria-hidden="true"><use href="#i-laptop"/></svg>
          <div><div class="strong" data-i18n="your_computer"></div><div class="muted small" id="pair-os"></div></div>
        </div>
        <p class="code" id="pair-code" aria-describedby="pair-status"></p>
        <p class="muted center" id="pair-status" role="status" aria-live="polite"></p>
      </div>
      <label class="field" for="pair-sent-name"><span data-i18n="device_name"></span></label>
      <input id="pair-sent-name" class="input" readonly>
      <p class="hint" data-i18n="pair_after"></p>
      <button class="btn quiet block" id="pair-cancel" type="button" data-i18n="cancel"></button>
    </div>

    <div id="pair-done" class="pair-stage hidden">
      <div class="notice" id="pair-done-box" role="alert">
        <svg aria-hidden="true"><use href="#i-alert"/></svg>
        <div><strong id="pair-done-title"></strong><p id="pair-done-text"></p></div>
      </div>
      <button class="btn secondary block hidden" id="pair-again" type="button" data-i18n="pair_again"></button>
    </div>
  </div>
</section>

<!-- Conversation list -->
<section id="view-list" class="view page hidden" aria-labelledby="list-h">
  <header class="topbar">
    <div class="brand"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><span>Atlas</span></div>
    <button class="icon-btn" id="settings-btn" type="button" data-i18n-label="settings"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
  </header>
  <div class="page-body">
    <button class="host-row" id="host-row" type="button">
      <svg class="row-icon" aria-hidden="true"><use href="#i-laptop"/></svg>
      <span class="host-name" id="host-name"></span>
      <span class="conn" id="list-conn"></span>
      <svg class="chev" aria-hidden="true"><use href="#i-chevron"/></svg>
    </button>
    <h1 tabindex="-1" class="display" id="list-h" data-i18n="chats"></h1>
    <div class="search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr-only" for="search" data-i18n="search"></label>
      <input id="search" type="search" class="input" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="search">
    </div>
    <div id="list-state" class="list-state hidden" role="status"></div>
    <div id="task-list" class="groups"></div>
    <p class="foot-note" id="list-foot" data-i18n="list_foot"></p>
  </div>
</section>

<!-- Conversation, permission and question -->
<section id="view-task" class="view chat hidden" aria-labelledby="task-h">
  <header class="chat-bar">
    <button class="icon-btn" id="back" type="button" data-i18n-label="back"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
    <div class="chat-title">
      <h1 tabindex="-1" id="task-h"></h1>
      <p class="conn-line"><span class="conn" id="task-conn"></span></p>
    </div>
    <button class="icon-btn hidden" id="screen-btn" type="button" aria-pressed="false" data-i18n-label="live_screen"><svg aria-hidden="true"><use href="#i-monitor"/></svg></button>
    <div class="menu-wrap">
      <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="task-menu" data-i18n-label="more"><svg aria-hidden="true"><use href="#i-more"/></svg></button>
      <div class="menu hidden" id="task-menu" role="menu">
        <button type="button" role="menuitem" id="m-pause"><svg aria-hidden="true"><use href="#i-pause"/></svg><span data-i18n="pause"></span></button>
        <button type="button" role="menuitem" id="m-resume"><svg aria-hidden="true"><use href="#i-play"/></svg><span data-i18n="resume"></span></button>
        <button type="button" role="menuitem" id="m-screen"><svg aria-hidden="true"><use href="#i-monitor"/></svg><span data-i18n="live_screen"></span></button>
        <button type="button" role="menuitem" id="m-preview"><svg aria-hidden="true"><use href="#i-monitor"/></svg><span data-i18n="preview"></span></button>
        <button type="button" role="menuitem" id="m-refresh"><svg aria-hidden="true"><use href="#i-refresh"/></svg><span data-i18n="refresh"></span></button>
      </div>
    </div>
  </header>

  <div class="offline-banner hidden" id="offline-banner" role="status">
    <svg aria-hidden="true"><use href="#i-unlink"/></svg>
    <div><strong id="offline-title"></strong><p id="offline-text"></p></div>
  </div>
  <button class="waiting-banner hidden" id="waiting-banner" type="button">
    <span class="dot warn" aria-hidden="true"></span><span id="waiting-text"></span><span class="link" id="waiting-open" data-i18n="view"></span>
  </button>

  <div class="view-switch segmented two hidden" id="view-switch" role="tablist" data-i18n-label="view_switch">
    <button type="button" role="tab" id="tab-chat" aria-selected="true" aria-controls="scroll"><span data-i18n="tab_chat"></span></button>
    <button type="button" role="tab" id="tab-screen" aria-selected="false" aria-controls="screen-pane"><span data-i18n="tab_screen"></span></button>
  </div>

  <section class="screen-pane hidden" id="screen-pane" aria-labelledby="screen-h">
    <h2 class="sr-only" id="screen-h" data-i18n="live_screen"></h2>
    <div class="screen-bar">
      <span class="dot" id="screen-dot" aria-hidden="true"></span>
      <span class="screen-state" id="screen-state" role="status" aria-live="polite"></span>
      <span class="screen-metrics" id="screen-metrics"></span>
    </div>
    <div class="screen-viewport" id="screen-viewport" tabindex="0" data-i18n-label="live_screen">
      <canvas id="screen-canvas" width="16" height="9"></canvas>
      <div class="screen-overlay hidden" id="screen-overlay"><svg aria-hidden="true"><use href="#i-unlink"/></svg><p id="screen-overlay-text"></p><button class="btn secondary hidden" id="screen-retry" type="button" data-i18n="retry"></button></div>
    </div>
    <p class="screen-note" id="screen-note"></p>
    <div class="screen-tools">
      <button class="icon-btn round" id="screen-zoom-out" type="button" data-i18n-label="zoom_out"><svg aria-hidden="true"><use href="#i-minus"/></svg></button>
      <span class="screen-zoom" id="screen-zoom" aria-live="polite">100%</span>
      <button class="icon-btn round" id="screen-zoom-in" type="button" data-i18n-label="zoom_in"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
      <button class="icon-btn round" id="screen-fit" type="button" data-i18n-label="zoom_fit"><svg aria-hidden="true"><use href="#i-fit"/></svg></button>
      <button class="icon-btn round" id="screen-full" type="button" data-i18n-label="fullscreen"><svg aria-hidden="true"><use href="#i-expand"/></svg></button>
      <button class="btn quiet screen-stop" id="screen-stop" type="button"><svg aria-hidden="true"><use href="#i-stop"/></svg><span data-i18n="stop_watching"></span></button>
    </div>
  </section>

  <div class="scroll" id="scroll">
    <div class="thread">
      <img id="preview-img" class="preview hidden" alt="">
      <ol class="messages" id="messages"></ol>
      <div id="activity"></div>
      <div id="run-errors"></div>
      <div id="status-card"></div>
    </div>
  </div>
  <button class="new-msgs hidden" id="new-msgs" type="button"><svg aria-hidden="true"><use href="#i-down"/></svg><span data-i18n="new_messages"></span></button>

  <div class="scroll pending-pane hidden" id="pending-pane" tabindex="-1"></div>

  <form class="composer" id="composer" novalidate>
    <div class="attach-chip hidden" id="attach-chip">
      <svg aria-hidden="true"><use href="#i-file"/></svg>
      <span class="attach-name" id="attach-name"></span>
      <span class="attach-state" id="attach-state" role="status"></span>
      <button class="icon-btn small" id="attach-remove" type="button" data-i18n-label="remove_attachment"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="composer-row">
      <label class="icon-btn round" id="attach-label">
        <input type="file" id="attach" accept="image/png,image/jpeg,image/gif,image/webp,text/plain,application/pdf" class="sr-only" data-i18n-label="attach">
        <svg aria-hidden="true"><use href="#i-clip"/></svg>
      </label>
      <div class="prompt-box">
        <label class="sr-only" for="prompt" data-i18n="message"></label>
        <textarea id="prompt" rows="1" maxlength="16000" enterkeyhint="enter"></textarea>
        <button class="send-btn" type="submit" id="send" data-i18n-label="send"><svg aria-hidden="true"><use href="#i-send"/></svg></button>
      </div>
    </div>
    <div class="composer-meta">
      <span class="model" id="model-name"></span>
      <span class="composer-note" id="composer-note" role="status"></span>
      <button class="stop-btn hidden" id="stop-btn" type="button"><span class="stop-ico"><svg aria-hidden="true"><use href="#i-stop"/></svg></span><span data-i18n="stop"></span></button>
    </div>
  </form>
</section>

<!-- Settings -->
<section id="view-settings" class="view page settings hidden" aria-labelledby="settings-h">
  <header class="chat-bar">
    <button class="icon-btn" id="settings-back" type="button" data-i18n-label="back"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
    <div class="chat-title"><h1 tabindex="-1" id="settings-h" data-i18n="settings"></h1></div>
    <svg class="mark end" aria-hidden="true"><use href="#i-mark"/></svg>
  </header>
  <div class="page-body">
    <h2 class="group-h" data-i18n="this_phone_group"></h2>
    <div class="group">
      <div class="row">
        <svg class="row-icon" aria-hidden="true"><use href="#i-phone"/></svg>
        <div class="row-main"><div id="set-device"></div><div class="muted small" id="set-paired"></div></div>
      </div>
      <div class="row">
        <svg class="row-icon" aria-hidden="true"><use href="#i-laptop"/></svg>
        <div class="row-main"><div id="set-computer"></div><div class="small"><span class="conn" id="set-conn"></span></div></div>
      </div>
    </div>

    <h2 class="group-h" id="theme-h" data-i18n="appearance"></h2>
    <div class="group">
      <div class="row">
        <svg class="row-icon" aria-hidden="true"><use href="#i-moon"/></svg>
        <div class="row-main"><span data-i18n="theme"></span></div>
      </div>
      <div class="segmented" role="radiogroup" aria-labelledby="theme-h">
        <label><input type="radio" name="theme" value="light"><span data-i18n="theme_light"></span></label>
        <label><input type="radio" name="theme" value="dark"><span data-i18n="theme_dark"></span></label>
        <label><input type="radio" name="theme" value="system"><span data-i18n="theme_system"></span></label>
      </div>
    </div>

    <h2 class="group-h" data-i18n="notifications_group"></h2>
    <div class="group">
      <label class="row" for="notify">
        <svg class="row-icon" aria-hidden="true"><use href="#i-bell"/></svg>
        <span class="row-main" data-i18n="notifications"></span>
        <input type="checkbox" role="switch" id="notify" class="switch">
      </label>
      <p class="row-note" id="notify-note"></p>
    </div>

    <h2 class="group-h" data-i18n="previews"></h2>
    <div class="group">
      <div class="row">
        <svg class="row-icon" aria-hidden="true"><use href="#i-monitor"/></svg>
        <div class="row-main" id="set-previews"></div>
      </div>
      <p class="row-note" id="set-previews-note"></p>
    </div>

    <h2 class="group-h" data-i18n="connection"></h2>
    <div class="group">
      <details class="row-details">
        <summary class="row"><svg class="row-icon" aria-hidden="true"><use href="#i-lock"/></svg><span class="row-main" data-i18n="certificate"></span><svg class="chev" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
        <div class="details-body"><p class="muted small" id="set-cert-note"></p><p class="mono small" id="set-fp"></p></div>
      </details>
    </div>

    <div id="install-section">
      <h2 class="group-h" data-i18n="install_group"></h2>
      <div class="group">
        <details class="row-details" id="install-details">
          <summary class="row"><svg class="row-icon" aria-hidden="true"><use href="#i-share"/></svg><span class="row-main" data-i18n="install_row"></span><svg class="chev" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
          <div class="details-body">
            <ol class="steps hidden" id="iphone-install"><li data-i18n="ios_step1"></li><li data-i18n="ios_step2"></li><li data-i18n="ios_step3"></li></ol>
            <ol class="steps hidden" id="android-install"><li data-i18n="android_step1"></li><li data-i18n="android_step2"></li><li data-i18n="android_step3"></li></ol>
            <p class="muted small" data-i18n="install_note"></p>
          </div>
        </details>
        <p class="row-note" id="install-summary"></p>
        <div class="row-note hidden" id="install-prompt-wrap"><button class="btn primary block" id="install-btn" type="button" data-i18n="install_now"></button></div>
        <div class="row-note hidden" id="transfer-wrap">
          <p data-i18n="transfer_offer"></p>
          <button class="btn secondary block" id="transfer-btn" type="button" data-i18n="transfer_create"></button>
          <p class="code transfer-code hidden" id="transfer-code-out" aria-live="polite"></p>
          <p class="muted small hidden" id="transfer-code-note"></p>
        </div>
      </div>
    </div>

    <div class="group danger-group">
      <button class="row danger" id="logout" type="button" aria-controls="logout-confirm" aria-expanded="false">
        <svg class="row-icon" aria-hidden="true"><use href="#i-trash"/></svg><span class="row-main" data-i18n="sign_out"></span>
      </button>
      <div class="confirm hidden" id="logout-confirm" role="group" aria-labelledby="logout-confirm-text">
        <p id="logout-confirm-text" data-i18n="sign_out_confirm"></p>
        <p class="form-error hidden" id="logout-error" role="alert"></p>
        <div class="confirm-actions">
          <button class="btn danger-fill" id="logout-yes" type="button" data-i18n="sign_out_yes"></button>
          <button class="btn secondary" id="logout-no" type="button" data-i18n="cancel"></button>
        </div>
      </div>
    </div>
    <p class="foot-note" id="set-version"></p>
  </div>
</section>
<script src="/app.js"></script>
</body>
</html>
