<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Atlas Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <button class="icon-btn hidden" id="back" type="button" aria-label="Back">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
  </button>
  <h1 id="title">Atlas</h1>
  <span class="conn" id="conn" role="status" aria-live="polite"></span>
  <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" /></svg>
  </button>
</header>
<div class="banner hidden" id="banner" role="alert"></div>
<main id="main" tabindex="-1">
  <section id="view-pair" class="view hidden" aria-labelledby="pair-h">
    <h2 id="pair-h" data-i18n="pair_title"></h2>
    <div id="pair-start">
      <p class="muted" data-i18n="pair_intro"></p>
      <label class="field"><span data-i18n="device_name"></span><input id="pair-name" autocomplete="off" maxlength="48"></label>
      <button class="btn primary block" id="pair-go" type="button" data-i18n="pair_button"></button>
    </div>
    <div id="pair-wait" class="hidden">
      <p data-i18n="pair_compare"></p>
      <p class="code" id="pair-code" aria-live="polite"></p>
      <p class="muted" id="pair-status" role="status" data-i18n="pair_waiting"></p>
    </div>
    <div id="pair-none" class="hidden">
      <p data-i18n="pair_need_qr"></p>
    </div>
  </section>

  <section id="view-list" class="view hidden" aria-labelledby="list-h">
    <h2 id="list-h" class="sr-only" data-i18n="tasks"></h2>
    <ul class="cards" id="task-list"></ul>
    <p class="empty hidden" id="list-empty" data-i18n="no_tasks"></p>
  </section>

  <section id="view-task" class="view hidden" aria-labelledby="task-h">
    <div class="task-head">
      <h2 id="task-h"></h2>
      <p class="meta" id="task-meta"></p>
      <div class="controls" id="task-controls">
        <button class="btn" id="ctl-pause" type="button" data-i18n="pause"></button>
        <button class="btn" id="ctl-resume" type="button" data-i18n="resume"></button>
        <button class="btn danger" id="ctl-stop" type="button" data-i18n="stop"></button>
        <button class="btn" id="ctl-preview" type="button" data-i18n="preview"></button>
      </div>
    </div>
    <div id="pending"></div>
    <img id="preview-img" class="preview hidden" alt="">
    <ol class="messages" id="messages" aria-live="polite"></ol>
    <form class="composer" id="composer">
      <label class="sr-only" for="prompt" data-i18n="message"></label>
      <textarea id="prompt" rows="2" maxlength="16000"></textarea>
      <div class="composer-row">
        <label class="btn" id="attach-label"><input type="file" id="attach" accept="image/png,image/jpeg,image/gif,image/webp,text/plain,application/pdf" class="sr-only"><span data-i18n="attach"></span></label>
        <span class="muted small" id="attach-info"></span>
        <button class="btn primary" type="submit" id="send" data-i18n="send"></button>
      </div>
    </form>
  </section>

    </div>

    <div id="install-section">
      <h2 class="group-h" data-i18n="install_group"></h2>
      <div class="group">
        <details class="row-details" id="install-details">
          <summary class="row"><svg class="row-icon" aria-hidden="true"><use href="#i-share"/></svg><span class="row-main" data-i18n="install_row"></span><svg class="chev" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
          <div class="details-body">
            <ol class="steps hidden" id="iphone-install"><li data-i18n="ios_step1"></li><li data-i18n="ios_step2"></li><li data-i18n="ios_step3"></li></ol>
            <ol class="steps hidden" id="android-install"><li data-i18n="android_step1"></li><li data-i18n="android_step2"></li><li data-i18n="android_step3"></li></ol>
            <p class="muted small" data-i18n="install_note"></p>
          </div>
        </details>
        <p class="row-note" id="install-summary"></p>
        <div class="row-note hidden" id="install-prompt-wrap"><button class="btn primary block" id="install-btn" type="button" data-i18n="install_now"></button></div>
        <div class="row-note hidden" id="transfer-wrap">
          <p data-i18n="transfer_offer"></p>
          <button class="btn secondary block" id="transfer-btn" type="button" data-i18n="transfer_create"></button>
          <p class="code transfer-code hidden" id="transfer-code-out" aria-live="polite"></p>
          <p class="muted small hidden" id="transfer-code-note"></p>
        </div>
      </div>
    </div>

    <div class="group danger-group">
      <button class="row danger" id="logout" type="button" aria-controls="logout-confirm" aria-expanded="false">
        <svg class="row-icon" aria-hidden="true"><use href="#i-trash"/></svg><span class="row-main" data-i18n="sign_out"></span>
      </button>
      <div class="confirm hidden" id="logout-confirm" role="group" aria-labelledby="logout-confirm-text">
        <p id="logout-confirm-text" data-i18n="sign_out_confirm"></p>
        <p class="form-error hidden" id="logout-error" role="alert"></p>
        <div class="confirm-actions">
          <button class="btn danger-fill" id="logout-yes" type="button" data-i18n="sign_out_yes"></button>
          <button class="btn secondary" id="logout-no" type="button" data-i18n="cancel"></button>
        </div>
      </div>
    </div>
    <p class="foot-note" id="set-version"></p>
  </div>
</section>
<script src="/app.js"></script>
</body>
</html>
