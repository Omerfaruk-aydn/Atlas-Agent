name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Without this one failing platform cancels the other two, so a run
      # only ever reports the first failure it happens to hit.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go build -race ./...
      - name: Auto-approve security corpus gate
        run: go test -race -count=1 -v ./internal/permission -run 'TestAutoApproveSecurityCorpus|TestAutoApproveRiskyCorpusNeverReachesModel'
      - name: Validate Windows speech installer routing
        run: node npm/cli/scripts/speech-setup.test.js
      - name: Enable sandboxed Chrome user namespaces on Ubuntu runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Validate Windows desktop and terminal fixtures
        if: runner.os == 'Windows'
        run: go test -race -count=1 ./internal/computer ./internal/ui/model -run 'TestWindowsAutomationReadAndFixtureOCR|TestWorkflowPanelRealPTYResizeStopAndClose'
      - name: Install pinned bench checker
        working-directory: bench
        run: npm install --ignore-scripts
      - run: go test -race -timeout 20m ./...

  web:
    # The web client: typecheck, unit tests and the production build that
    # internal/webui embeds. The Go jobs above do not need it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build

  browser-regression:
    # Ubuntu 24.04 is pinned: Playwright lacks Chromium support on 26.04. Missing Go or Chromium dependencies
    # fail this job; an unsupported driver is never reported as a pass/skip.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enable sandboxed Chrome user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm --prefix web ci
      - name: Validate runner and assertion contracts
        run: go test -race -count=1 ./internal/agent/tools ./internal/webui/webtest -run 'TestBrowserWorkflow|TestBrowserPipeline|TestBrowserRegression'
      - name: Install supported Chromium and runtime dependencies
        run: npx --prefix web playwright install --with-deps chromium
      - name: Build isolated real Atlas web stack
        run: npm --prefix web run build && go build -trimpath -o dist/dev/atlas-web-dev .
      - name: Run Atlas browser-use regressions
        run: npm --prefix web run e2e:browser-use
      # Keep Playwright during the migration: the new scenarios cover the
      # requested high-risk paths, not attachment, cross-client, permission,
      # responsiveness and anti-CSRF equivalence yet.
      - name: Run preserved Playwright coverage
        run: npm --prefix web run e2e
      - name: Upload browser regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-use-regression
          path: web/test-results/
          if-no-files-found: error
          retention-days: 14
