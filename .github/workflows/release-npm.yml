name: Release NPM

# Triggered by the Release workflow completing successfully. Publishes the
# wrapper package @atlas-coder/atlas-agent to npmjs with the version that
# matches the release tag.
#
# Setup required:
#   - secrets.NPM_TOKEN must be set in repo settings (publish automation token
#     with bypass-2fa enabled; classic or granular with "Publish packages").

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1). Defaults to latest published release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish @atlas-coder/atlas-agent
    runs-on: ubuntu-latest
    # When triggered by workflow_run, only publish on success. When triggered
    # manually we skip the gate — the operator picked the tag on purpose.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve release version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
          elif [ "${{ github.event_name }}" = 'workflow_run' ] && [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No release tag found"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Also export VERSION as an env var so downstream steps can
          # reference it without having to plumb the step id everywhere.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version $VERSION from tag $TAG"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync package.json version
        working-directory: npm/cli
        # Pin npm/cli/package.json to the same semver as the git tag we're
        # publishing, so the npm wrapper's postinstall downloads the right
        # binary (its URL is built from package.json version). If the local
        # version already matches, this is a no-op.
        run: |
          TAG_VER="${VERSION}"
          LOCAL_VER=$(node -p "require('./package.json').version")
          echo "Current local version: $LOCAL_VER"
          echo "Release tag version:   $TAG_VER"
          if [ "$LOCAL_VER" != "$TAG_VER" ]; then
            echo "Bumping package.json to $TAG_VER"
            npm version "$TAG_VER" --no-git-tag-version --allow-same-version
          else
            echo "package.json already at $TAG_VER, skipping bump"
          fi
          echo "Final package.json version: $(node -p "require('./package.json').version")"

      - name: Verify package contents
        working-directory: npm/cli
        run: |
          echo "--- npm pack --dry-run ---"
          npm pack --dry-run
          echo "--- package.json ---"
          cat package.json

      - name: Publish to npmjs
        working-directory: npm/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # setup-node writes registry authentication with an environment
        # placeholder, so the secret is not interpolated into shell code.
        run: |
          npm publish --access public
